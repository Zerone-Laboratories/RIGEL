services:
  rigel-server:
    build: .
    environment:
      - GROQ_API_KEY= # Ensure this is set in your environment
      - DEFAULT_INFERENCE_ENGINE=${DEFAULT_INFERENCE_ENGINE:-ollama} # Default to ollama, can be set to 'groq'
      - OLLAMA_USE_GPU=true # Force Ollama to use GPU
      - RIGEL_ADMIN_KEY=this_is_a_secret_key
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://localhost:11434}
      - PRODUCTION=true
      - PYTHONUNBUFFERED=1
      - SERVER_TYPE=dbus # Options: web_instanced|web|web_v2|dbus
    ports:
      - "8000:8000"
      - "9000-9100:9000-9100"  # Range for tenant MCP servers
      - "11434:11434"
    volumes:
      - .:/app
      - ./user_tools:/app/user_tools
      - ./user_rag:/app/user_rag
      # Persist databases under /app/db (host ./db)
      - ./db:/app/db
      - ollama-models:/root/.ollama
      # Mount D-Bus system socket for system bus access
      - /var/run/dbus:/var/run/dbus:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
      
  rigel-tools-server:
    build: .
    environment:
      - RIGEL_ADMIN_KEY=this_is_a_secret_key
    command: python -m core.mcp.rigel_tools_server
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - ./user_tools:/app/user_tools
      - ./user_rag:/app/user_rag

volumes:
  ollama-models:
