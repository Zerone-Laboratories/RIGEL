version: '3.8'
services:
  rigel-server:
    build: .
    environment:
      - SERVER_TYPE=dbus # Change to 'dbus' to run dbus_server.py
      - GROQ_API_KEY= # Ensure this is set in your environment
      - INFERENCE_ENGINE=${INFERENCE_ENGINE:-ollama} # Default to groq, can be set to 'ollama'
      - OLLAMA_USE_GPU=true # Force Ollama to use GPU
      - RIGEL_ADMIN_KEY=this_is_a_secret_key
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
    command: >
      sh -c "if [ \"$$INFERENCE_ENGINE\" = 'ollama' ]; then (nohup ollama serve &) && sleep 5; fi &&
             if [ \"$$SERVER_TYPE\" = 'dbus' ]; then python dbus_server.py; else python web_server.py; fi"
    ports:
      - "8000:8000"
      - "11434:11434"
    volumes:
      - .:/app
      - ollama-models:/root/.ollama
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:rw
      - ./rigel-dbus.conf:/etc/dbus-1/system.d/rigel-dbus.conf:ro
      - /etc/dbus-1/system.d/:/etc/dbus-1/system.d/:ro
    privileged: true
    cap_add:
      - SYS_ADMIN
      
  rigel-tools-server:
    build: .
    environment:
      - RIGEL_ADMIN_KEY=this_is_a_secret_key
    command: python -m core.mcp.rigel_tools_server
    ports:
      - "8001:8001"
    volumes:
      - .:/app

  rigel-server-gpu:
    extends:
      service: rigel-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - gpu

volumes:
  ollama-models:
