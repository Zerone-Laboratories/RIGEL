version: '3.8'
services:
  rigel-server:
    build: .
    environment:
      - SERVER_TYPE=web # Change to 'dbus' to run dbus_server.py
      - GROQ_API_KEY={} # Ensure this is set in your environment
      - INFERENCE_ENGINE=${INFERENCE_ENGINE:-ollama} # Default to groq, can be set to 'ollama'
      - OLLAMA_USE_GPU=true # Force Ollama to use GPU
      - RIGEL_ADMIN_KEY=this_is_a_secret_key
    command: >
      sh -c "if [ \"$$INFERENCE_ENGINE\" = 'ollama' ]; then (nohup ollama serve &) && sleep 5; fi && 
             if [ \"$$SERVER_TYPE\" = 'dbus' ]; then python dbus_server.py; else python web_server.py; fi"
    ports:
      - "8000:8000" # Adjust if your web_server.py uses a different port
      - "11434:11434" # Ollama API port if INFERENCE_ENGINE=ollama
    volumes:
      - .:/app
      - ollama-models:/root/.ollama # Persist Ollama models

  rigel-server-gpu:
    extends:
      service: rigel-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - gpu

volumes:
  ollama-models: # Volume for Ollama models
