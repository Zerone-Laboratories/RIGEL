<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow the docker container user to own and access the service -->
  <policy user="root">
    <allow own="com.rigel.RigelService"/>
    <allow send_destination="com.rigel.RigelService"/>
    <allow receive_sender="com.rigel.RigelService"/>
  </policy>
  
  <!-- Allow any user to send messages to the service -->
  <policy context="default">
    <allow send_destination="com.rigel.RigelService"/>
    <allow receive_sender="com.rigel.RigelService"/>
  </policy>
</busconfig>
